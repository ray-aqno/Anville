[project]
name = "anville"
version = "0.1.0"
description = "Closes the design loop between engineers and the shop floor."
requires-python = ">=3.12"
dependencies = [
    "cadquery-ocp-novtk==8.0.1.1.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
